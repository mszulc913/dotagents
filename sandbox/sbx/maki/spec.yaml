schemaVersion: "2"
kind: sandbox
name: maki
displayName: Maki
description: Maki coding agent (maki.sh), OpenRouter key stays in the host proxy.

sandbox:
  image: maki-sbx:latest
  entrypoint:
    - bash
    - -c
    - maki trust --yes >/dev/null 2>&1 || true; exec maki --yolo

setup:
  startup:
    - command:
        - bash
        - -c
        - |
          cfg="$HOME/.config/maki"
          if [ -n "${DOTAGENTS_REPO:-}" ] && [ -f "$DOTAGENTS_REPO/AGENTS.md" ] && [ -d "$DOTAGENTS_REPO/skills" ]; then
            mkdir -p "$cfg/skills"
            ln -sfn "$DOTAGENTS_REPO/AGENTS.md" "$cfg/AGENTS.md"
            for entry in "$DOTAGENTS_REPO"/skills/*; do
              ln -sfn "$entry" "$cfg/skills/$(basename "$entry")"
            done
          fi
      description: Link AGENTS.md and skills from the mounted dotagents paths

credentials:
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          scheme: bearer

permissions:
  network:
    allow:
      - openrouter.ai
      - models.dev
      - pypi.org
      - files.pythonhosted.org

environment:
  variables:
    UV_PROJECT_ENVIRONMENT: /home/agent/venv
